services:
  # --- MAIN FRONTEND ---
  frontend:
    build: 
      context: .
      dockerfile: ./services/gateway/Dockerfile # Reusing gateway Dockerfile as it has the same PHP/Apache setup
    ports:
      - "8080:80"
    environment:
      - GATEWAY_HOST=gateway
    volumes:
      - .:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
    networks:
      - icmis_network

  # --- LIVE RELOAD PROXY ---
  browser-sync:
    image: node:alpine
    working_dir: /source
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - .:/source
    command: npx browser-sync start --proxy "frontend" --files "**/*.php, **/*.css, **/*.js"
    depends_on:
      - frontend
    networks:
      - icmis_network

  # --- PHP MICROSERVICES ---
  gateway:
    build: ./services/gateway
    ports:
      - "8000:80"
    volumes:
      - ./services/gateway:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
    networks:
      - icmis_network

  auth-service:
    build: ./services/auth
    environment:
      - DATABASE_URL=pgsql://postgres:postgres@db_main:5432/icmis_db
    volumes:
      - ./services/auth:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
    networks:
      - icmis_network

  project-service:
    build: ./services/project
    environment:
      - DATABASE_URL=pgsql://postgres:postgres@db_main:5432/icmis_db
    volumes:
      - ./services/project:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
    networks:
      - icmis_network

  budget-service:
    build: ./services/budget
    environment:
      - DATABASE_URL=pgsql://postgres:postgres@db_main:5432/icmis_db
    volumes:
      - ./services/budget:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
    networks:
      - icmis_network

  procurement-service:
    build: ./services/procurement
    environment:
      - DATABASE_URL=pgsql://postgres:postgres@db_main:5432/icmis_db
    volumes:
      - ./services/procurement:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
    networks:
      - icmis_network

  workforce-service:
    build: ./services/workforce
    environment:
      - DATABASE_URL=pgsql://postgres:postgres@db_main:5432/icmis_db
    volumes:
      - ./services/workforce:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
    networks:
      - icmis_network

  reports-service:
    build: ./services/reports
    environment:
      - DATABASE_URL=pgsql://postgres:postgres@db_main:5432/icmis_db
    volumes:
      - ./services/reports:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
    networks:
      - icmis_network

  admin-service:
    build: ./services/admin
    environment:
      - DATABASE_URL=pgsql://postgres:postgres@db_main:5432/icmis_db
    volumes:
      - ./services/admin:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini
    networks:
      - icmis_network

  # --- SINGLE SHARED POSTGRESQL DATABASE ---
  db_main:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: icmis_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./db/init/auth.sql:/docker-entrypoint-initdb.d/01-auth.sql
      - ./db/init/project.sql:/docker-entrypoint-initdb.d/02-project.sql
      - ./db/init/budget.sql:/docker-entrypoint-initdb.d/03-budget.sql
      - ./db/init/procurement.sql:/docker-entrypoint-initdb.d/04-procurement.sql
      - ./db/init/workforce.sql:/docker-entrypoint-initdb.d/05-workforce.sql
      - ./db/init/reports.sql:/docker-entrypoint-initdb.d/06-reports.sql
      - ./db/seed/workforce_seed.sql:/docker-entrypoint-initdb.d/99-workforce_seed.sql
      - db_data:/var/lib/postgresql/data
    networks:
      - icmis_network

volumes:
  db_data:

networks:
  icmis_network:
    driver: bridge
