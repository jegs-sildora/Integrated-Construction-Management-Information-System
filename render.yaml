# ICMIS Render Blueprint
# Orchestrates the deployment of the ICMIS Microservices stack on Render.com

services:
  # ----------------------------------------------------------------------------
  # 1. API GATEWAY (Public Entry Point)
  # ----------------------------------------------------------------------------
  - type: web
    name: icmis-gateway
    env: php
    plan: starter
    rootDir: services/gateway
    healthCheckPath: /
    envVars:
      - key: AUTH_SERVICE_URL
        value: https://icmis-auth.onrender.com
      - key: PROJECT_SERVICE_URL
        value: https://icmis-project.onrender.com
      - key: BUDGET_SERVICE_URL
        value: https://icmis-budget.onrender.com
      - key: PROCUREMENT_SERVICE_URL
        value: https://icmis-procurement.onrender.com
      - key: WORKFORCE_SERVICE_URL
        value: https://icmis-workforce.onrender.com
      - key: REPORTS_SERVICE_URL
        value: https://icmis-reports.onrender.com
      - key: ADMIN_SERVICE_URL
        value: https://icmis-admin.onrender.com

  # ----------------------------------------------------------------------------
  # 2. AUTH SERVICE (Private)
  # ----------------------------------------------------------------------------
  - type: web
    name: icmis-auth
    env: php
    plan: starter
    rootDir: services/auth
    region: singapore # Adjust based on your primary users
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icmis-auth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # ----------------------------------------------------------------------------
  # 3. PROJECT SERVICE (Private)
  # ----------------------------------------------------------------------------
  - type: web
    name: icmis-project
    env: php
    plan: starter
    rootDir: services/project
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icmis-project-db
          property: connectionString

  # ----------------------------------------------------------------------------
  # 4. BUDGET SERVICE (Private)
  # ----------------------------------------------------------------------------
  - type: web
    name: icmis-budget
    env: php
    plan: starter
    rootDir: services/budget
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icmis-budget-db
          property: connectionString
      - key: PROJECT_SERVICE_URL
        value: https://icmis-project.onrender.com

  # ----------------------------------------------------------------------------
  # 5. PROCUREMENT SERVICE (Private)
  # ----------------------------------------------------------------------------
  - type: web
    name: icmis-procurement
    env: php
    plan: starter
    rootDir: services/procurement
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icmis-procurement-db
          property: connectionString
      - key: PROJECT_SERVICE_URL
        value: https://icmis-project.onrender.com

  # ----------------------------------------------------------------------------
  # 6. WORKFORCE SERVICE (Private)
  # ----------------------------------------------------------------------------
  - type: web
    name: icmis-workforce
    env: php
    plan: starter
    rootDir: services/workforce
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icmis-workforce-db
          property: connectionString
      - key: AUTH_SERVICE_URL
        value: https://icmis-auth.onrender.com
      - key: PROJECT_SERVICE_URL
        value: https://icmis-project.onrender.com

  # ----------------------------------------------------------------------------
  # ----------------------------------------------------------------------------
  # 7. REPORTS SERVICE (Private)
  # ----------------------------------------------------------------------------
  - type: web
    name: icmis-reports
    env: php
    plan: starter
    rootDir: services/reports
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icmis-reports-db
          property: connectionString
      - key: AUTH_SERVICE_URL
        value: https://icmis-auth.onrender.com
      - key: PROJECT_SERVICE_URL
        value: https://icmis-project.onrender.com

  # ----------------------------------------------------------------------------
  # 8. ADMIN SERVICE (Private)
  # ----------------------------------------------------------------------------
  - type: web
    name: icmis-admin
    env: php
    plan: starter
    rootDir: services/admin
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icmis-auth-db # Admin shares Auth DB or has its own? PRD says isolated. 
          # Actually, Admin usually checks audit logs from all or has its own. 
          # Let's use auth-db for now if it manages users, or create icmis-admin-db.
          # For consistency with earlier migrations, let's assume it has its own.
          property: connectionString
      - key: AUTH_SERVICE_URL
        value: https://icmis-auth.onrender.com

  # ----------------------------------------------------------------------------
  # 9. FRONTEND (Public Monolith UI)
  # ----------------------------------------------------------------------------
  - type: web
    name: icmis-frontend
    env: php
    plan: starter
    rootDir: .
    envVars:
      - key: APP_ENV
        value: production
      - key: GATEWAY_URL
        fromService:
          name: icmis-gateway
          property: host
      - key: BASE_URL
        sync: false # Set this in dashboard to the final public URL

# ------------------------------------------------------------------------------
# DATABASES (Managed PostgreSQL)
# ------------------------------------------------------------------------------
databases:
  - name: icmis-auth-db
    plan: starter
    databaseName: auth
    user: icmis_user

  - name: icmis-project-db
    plan: starter
    databaseName: project
    user: icmis_user

  - name: icmis-budget-db
    plan: starter
    databaseName: budget
    user: icmis_user

  - name: icmis-procurement-db
    plan: starter
    databaseName: procurement
    user: icmis_user

  - name: icmis-workforce-db
    plan: starter
    databaseName: workforce
    user: icmis_user

  - name: icmis-reports-db
    plan: starter
    databaseName: reports
    user: icmis_user

  - name: icmis-admin-db
    plan: starter
    databaseName: admin
    user: icmis_user
